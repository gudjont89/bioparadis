    [{m:"amrum",t:"21:00",tk:"https://tickets.bioparadis.is/#/book/14129",ev:["german"]}],
    [{m:"lenin",t:"21:00",tk:"https://tickets.bioparadis.is/#/book/12761",ev:["german","party"]}],
  ]},
};

/* Tracking */
let tr={};try{tr=JSON.parse(localStorage.getItem("bp_tr")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("bp_tr",JSON.stringify(tr))}catch(e){}};
const gS=id=>tr[id]||null;
const sS=(id,s)=>{tr[id]===s?delete tr[id]:tr[id]=s;sv()};

/* All screenings for a movie */
function allScr(mid){
  const r=[];
  for(const[d,day]of Object.entries(SC)){
    if(!day.lanes)continue;
    for(const lane of day.lanes)for(const s of lane)
      if(s.m===mid)r.push({date:d,label:day.label,time:s.t,tk:s.tk,ev:s.ev||[]});
  }
  return r;
}

/* No show/hide toggle — dampened cards always visible */

const dates=Object.keys(SC);
let aD=dates[0],selC=null,selS=null;

function renderDates(){
  const el=document.getElementById("dates");el.innerHTML="";
  dates.forEach(d=>{
    const day=SC[d],empty=!day.lanes||!day.lanes.length||day.lanes.every(l=>!l.length);
    const c=document.createElement("button");c.className="dc"+(d===aD?" act":"");
    let h=`<span class="lb">${day.label}</span>`;
    if(day.sub)h+=`<span class="sl">${day.sub}</span>`;else if(empty)h+=`<span class="ed"></span>`;
    c.innerHTML=h;
    c.onclick=()=>{aD=d;selC=null;selS=null;renderDates();renderTL();closeDet()};
    el.appendChild(c);
  });
}

function badgeHtml(evArr){
  if(!evArr||!evArr.length)return"";
  return'<div class="badges">'+evArr.map(e=>EV[e]?`<span>${EV[e].emoji}</span>`:"").join("")+"</div>";
}

function renderTL(){
  const wrap=document.getElementById("tw"),tl=document.getElementById("tl"),day=SC[aD];
  if(!day.lanes||!day.lanes.length||day.lanes.every(l=>!l.length)){
    tl.style.width="auto";
    tl.innerHTML='<div class="empty"><div class="ei">📋</div><div>No screenings scheduled</div><div class="em">schedule will appear when available</div></div>';return;
  }
  const W=(H1-H0)*60*PX+60;tl.style.width=W+"px";tl.innerHTML="";
  for(let h=H0;h<=H1;h++){const x=(h-H0)*60*PX+20;
    const l=document.createElement("div");l.className="gl";l.style.left=x+"px";tl.appendChild(l);
    const lb=document.createElement("div");lb.className="gla";lb.style.left=x+"px";lb.textContent=pad(h)+":00";tl.appendChild(lb);
  }
  const ls=document.createElement("div");ls.className="lanes";
  day.lanes.forEach((lane,li)=>{
    const le=document.createElement("div");le.className="lane";
    lane.forEach((s,si)=>{
      const mv=M[s.m],st=gS(s.m),isDamp=st==="seen"||st==="skip";
      const off=t2m(s.t)-H0*60,w=Math.max(mv.r*PX,MW),left=off*PX;
      const cid=`${aD}-${li}-${si}`,isSel=selC===cid;
      const card=document.createElement("div");
      let cls="card";if(isSel)cls+=" sel";if(isDamp)cls+=" damp";if(st==="want")cls+=" want";
      card.className=cls;card.style.left=left+"px";card.style.width=w+"px";card.style.background=mv.c;
      if(isSel)card.style.boxShadow=`0 4px 20px ${mv.c}88, 0 0 0 2px #fff`;
      else if(st!=="want")card.style.boxShadow="0 2px 8px rgba(0,0,0,.35)";
      card.innerHTML=`<img class="cp" src="${mv.p}" alt="" loading="lazy"><div class="ci" style="background:linear-gradient(135deg,${mv.c}ee,${mv.c}cc)"><div class="ct">${mv.t}</div><div class="cm">${s.t} · ${mv.r}m</div>${badgeHtml(s.ev)}</div>`;
      card.onclick=()=>{selC=cid;selS=s;renderTL();showDet(s,mv)};
      le.appendChild(card);
    });
    if(li===0&&aD===dates[0]){const now=new Date(),nm=now.getHours()*60+now.getMinutes()-H0*60;
      if(nm>=0&&nm<=(H1-H0)*60){const nl=document.createElement("div");nl.className="nl";nl.style.left=(nm*PX)+"px";nl.innerHTML='<div class="nd"></div>';le.appendChild(nl)}}
    ls.appendChild(le);
  });
  tl.appendChild(ls);
  if(aD===dates[0]){const now=new Date(),nm=now.getHours()*60+now.getMinutes()-H0*60;wrap.scrollLeft=Math.max(0,nm*PX-120)}
  else{const f=day.lanes.flat()[0];if(f)wrap.scrollLeft=Math.max(0,(t2m(f.t)-H0*60)*PX-40)}
}

function showDet(s,mv){
  const p=document.getElementById("det"),iso=SC[aD].iso,end=eT(s.t,mv.r);
  const cs=iso+"T"+s.t.replace(":","")+"00",ce=iso+"T"+end.replace(":","")+"00";
  const cu=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("Bíó Paradís: "+mv.t)}&dates=${cs}/${ce}&location=${encodeURIComponent("Hverfisgata 54, 101 Reykjavík")}&details=${encodeURIComponent("Buy tickets: "+s.tk)}`;
  p.style.borderTopColor=mv.c;
  document.getElementById("dp").src=mv.p;
  document.getElementById("dt").textContent=mv.t;
  document.getElementById("dm").textContent=`${s.t} – ${end} · ${mv.r} min`;

  // Event pills — multiple
  const evtsEl=document.getElementById("devts");
  if(s.ev&&s.ev.length){
    evtsEl.innerHTML=s.ev.map(e=>EV[e]?`<div class="det-ev"><span class="be">${EV[e].emoji}</span>${EV[e].name}</div>`:"").join("");
    evtsEl.style.display="flex";
  }else{evtsEl.innerHTML="";evtsEl.style.display="none"}

  const tb=document.getElementById("dtk");tb.href=s.tk;tb.style.background=mv.c;
  document.getElementById("dcal").href=cu;
  const st=gS(s.m);
  updB("bw",st==="want","aw");updB("bs",st==="seen","as");updB("bk",st==="skip","ak");

  // Upcoming
  const du=document.getElementById("du"),all=allScr(s.m);
  if(all.length>1){
    let h='<div class="det-up-label">All showtimes</div><div class="det-up-list">';
    all.forEach(sc=>{
      const isCur=sc.date===aD&&sc.time===s.t;
      const isPast=sc.date<aD;
      let cls="det-up-chip";if(isCur)cls+=" cur";if(isPast)cls+=" past";
      const evBadges=sc.ev.map(e=>EV[e]?`<span class="ub">${EV[e].emoji}</span>`:"").join("");
      h+=`<a class="${cls}" href="${sc.tk}" target="_blank" rel="noopener"><span class="ud">${sc.label}</span><span class="ut">${sc.time}</span>${evBadges}</a>`;
    });
    h+="</div>";du.innerHTML=h;du.style.display="block";
  }else{du.innerHTML="";du.style.display="none"}
  p.className="det open";
}

function updB(id,on,cls){const b=document.getElementById(id);b.classList.remove("aw","as","ak");if(on)b.classList.add(cls)}
function closeDet(){document.getElementById("det").className="det";selC=null;selS=null}
document.getElementById("dx").onclick=()=>{closeDet();renderTL()};
function doTr(st){if(!selS)return;sS(selS.m,st);showDet(selS,M[selS.m]);renderTL()}
document.getElementById("bw").onclick=()=>doTr("want");
document.getElementById("bs").onclick=()=>doTr("seen");
document.getElementById("bk").onclick=()=>doTr("skip");

renderDates();renderTL();
</script>
</body>
</html>
